services:
  - type: web
    name: agent-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn run_api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: API_TOKEN
        sync: false
